services:
  python:
    image: python:alpine
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: sh -c "apk update && apk upgrade && apk add build-base && pip install --upgrade pip && pip install pandas && pip install matplotlib && exec python"

